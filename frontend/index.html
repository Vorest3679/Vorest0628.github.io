<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/webp" sizes="512x512" href="/ico.webp"/>
    <link rel="icon" type="image/png" sizes="32x32" href="/ico-32.png"/>
    <link rel="alternate" type="application/rss+xml" title="Vorest 博客" href="/rss.xml"/>
    <!-- 提前下载背景图，优先保障首屏脚本和样式。 -->
    <link rel="preload" as="image" type="image/webp" href="/assets/scenery-bg.webp" fetchpriority="low"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta name="description" itemprop="description" content="Vorest个人网站 - Anime Summer Sky Theme" />
    <meta itemprop="name" content="Vorest's Personal Website"/>
    <meta itemprop="image" content="/ico.webp"/>
    
    <!-- 预加载关键模块 - 聚集资源加载，提高首屏性能 -->
    <link rel="modulepreload" href="/src/main.js">
    
    <title>Vorest's Personal Website</title>
    <script>
      (function () {
        const { history, location } = window
        const searchParams = new URLSearchParams(location.search)
        const redirect = searchParams.get('__spa')

        // 还原 GitHub Pages 404 中转过来的 history 路径。
        if (redirect && redirect.startsWith('/')) {
          history.replaceState(null, '', redirect)
          return
        }

        if (!location.hash.startsWith('#/')) {
          return
        }

        const hashTarget = location.hash.slice(1)
        const target =
          (hashTarget.startsWith('/') && hashTarget !== '/')
            ? hashTarget
            : `${location.pathname}${location.search}` || '/'

        history.replaceState(null, '', target)
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
