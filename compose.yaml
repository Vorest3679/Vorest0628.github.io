services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${DOCKER_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: ${DOCKER_MONGODB_URI:-${MONGODB_URI:-mongodb://mongo:27017/vorest}}
      JWT_SECRET: ${DOCKER_JWT_SECRET:-${JWT_SECRET:?请在根目录 .env 中设置 JWT_SECRET，或通过 --env-file 指定包含密钥的文件}}
      JWT_EXPIRES_IN: 7d
      STORAGE_DRIVER: local
      SITE_URL: ${DOCKER_SITE_URL:-${SITE_URL:-http://localhost:8080}}
      CORS_ORIGIN: ${DOCKER_CORS_ORIGIN:-${DOCKER_SITE_URL:-${CORS_ORIGIN:-${SITE_URL:-http://localhost:8080}}}}
    volumes:
      # 宿主机 backend/uploads 是上传文件的唯一来源：容器内 /app/uploads 直接映射到这里，
      # 备份、迁移和排查都以该目录为准。目录需对容器用户（uid 1000）可写，见 README。
      - ./backend/uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    restart: unless-stopped

volumes:
  mongo_data:
