services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${DOCKER_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/vorest
      JWT_SECRET: ${DOCKER_JWT_SECRET:?请在 .env.docker 中设置 DOCKER_JWT_SECRET}
      JWT_EXPIRES_IN: 7d
      STORAGE_DRIVER: local
      SITE_URL: ${DOCKER_SITE_URL:-http://localhost:8080}
      CORS_ORIGIN: ${DOCKER_SITE_URL:-http://localhost:8080}
    volumes:
      - uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    restart: unless-stopped

volumes:
  mongo_data:
  uploads:
