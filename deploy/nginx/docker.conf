server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Allow multipart overhead for the backend's 50 MiB file limit.
    client_max_body_size 64m;

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        include /etc/nginx/proxy_params.conf;
    }

    location /uploads/ {
        proxy_pass http://backend:3000;
        include /etc/nginx/proxy_params.conf;
    }

    location = /rss.xml {
        proxy_pass http://backend:3000/api/rss.xml;
        include /etc/nginx/proxy_params.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
