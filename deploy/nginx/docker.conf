server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Allow multipart overhead for the backend's 50 MiB file limit.
    client_max_body_size 64m;

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://backend:3000;
        include /etc/nginx/proxy_params.conf;
    }

    location /uploads/ {
        proxy_pass http://backend:3000;
        include /etc/nginx/proxy_params.conf;
    }

    location = /rss.xml {
        proxy_pass http://backend:3000/api/rss.xml;
        include /etc/nginx/proxy_params.conf;
    }

    # 构建产物带内容 hash，文件名变了就是新内容，可以长期缓存。
    # 缺失时返回 404，不能落到 index.html：否则浏览器会把 HTML 当成
    # JS/CSS/图片缓存下来，和 SPA 回退的 200 混在一起难以排查。
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # public/ 原样拷贝出来的文件（ico、pdf.worker 等）文件名固定、内容会变，
    # 必须每次向服务器确认，避免换了图或改了 worker 后拿到旧缓存。
    location = /ico.webp {
        add_header Cache-Control "no-cache" always;
    }

    location = /ico-32.png {
        add_header Cache-Control "no-cache" always;
    }

    location = /pdf.worker.min.mjs {
        add_header Cache-Control "no-cache" always;
    }

    # SPA 回退：带 hash 的入口必须 no-cache，否则新版 index.html 可能一直
    # 引用旧的 JS，表现就是“已经重新构建了但页面还是旧的”。
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location = / {
        try_files $uri /index.html;
    }

    location / {
        try_files $uri /index.html;
    }
}
