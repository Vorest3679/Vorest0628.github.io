# 在网站的 Nginx server 块中 include 本文件。
# 如果后端使用其他地址或端口，请修改 proxy_pass。
# SPA 回退应放在 location / 内，避免 server 级 rewrite 提前改写 /rss.xml。
location = /rss.xml {
    proxy_pass http://127.0.0.1:3000/api/rss.xml;
    # 后端错误原样返回，避免继承的代理错误页配置将请求送入前端 404。
    proxy_intercept_errors off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}
